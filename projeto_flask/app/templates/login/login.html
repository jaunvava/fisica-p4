{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<section class="card card-form">
  <h1>Entrar</h1>

  <form method="post">
    <label for="nome_usuario">Usuário</label>
    <input class="input" type="text" id="nome_usuario" name="nome_usuario" required autofocus
           value="{{ dados.get('nome_usuario', '') }}" />

    <label for="senha">Senha</label>
    <input class="input" type="password" id="senha" name="senha" required />

    <div class="botoes">
      <a href="{{ url_for('auth.registrar') }}" class="btn btn-sec">Criar conta</a>
      <button type="submit" class="btn">Entrar</button>
    </div>
  </form>
</section>
{% endblock %}
